name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A retry or a second upload leaves two artifacts named github-pages.
      # deploy-pages fails instead of choosing one. Keep the newest.
      - name: Drop duplicate pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              },
            );
            const pages = artifacts
              .filter((artifact) => artifact.name === "github-pages" && !artifact.expired)
              .sort((a, b) => b.id - a.id);
            core.info(`Found ${pages.length} github-pages artifact(s).`);
            for (const extra of pages.slice(1)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: extra.id,
              });
              core.info(`Deleted duplicate artifact ${extra.id}.`);
            }
      - id: deployment
        uses: actions/deploy-pages@v4
